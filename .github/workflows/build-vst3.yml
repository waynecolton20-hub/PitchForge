name: Build PitchForge VST3 (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-vst3:
    name: Build Windows VST3
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: pwsh
        run: |
          if (-not (Test-Path CMakeLists.txt)) {
            throw 'PitchForge source is not present: CMakeLists.txt was not found.'
          }

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Locate VST3 bundle
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Filter *.vst3 -Recurse -Directory |
            Where-Object { $_.Name -eq 'PitchForge.vst3' } |
            Select-Object -First 1

          if (-not $vst3) {
            Write-Host 'Build directory contents:'
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw 'No PitchForge.vst3 bundle was produced by the build.'
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $vst3.FullName -Destination artifact/PitchForge.vst3 -Recurse -Force

      - name: Package VST3
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifact/PitchForge.vst3 `
            -DestinationPath artifact/PitchForge-Windows-VST3.zip `
            -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PitchForge-Windows-VST3
          path: artifact/PitchForge-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
